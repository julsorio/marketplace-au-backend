spring.application.name=marketplace-api

#context path
server.servlet.context-path=/marketplace-api/v1
#port
server.port=8002
#jwt secret
jwt.secret=CpsOwLfL7lhIMXc/aIOYPi6gRXAJbuNMu7OymFP57Oc=
#jwt expiration
jwt.expiration=300000
#log level
logging.level.com.marketplaceau.backend=info
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.mongodb.driver=DEBUG
logging.level.org.springframework.boot.autoconfigure.mongo=DEBUG

#mongodb uri
spring.mongodb.uri=mongodb://localhost:27017/marketplace

cors.allowed-origins=http://localhost:4200

#stripe: claves de PRUEBA como variables de entorno, nunca en el repo (es publico).
#Sin STRIPE_SECRET_KEY el backend arranca igual, pero los pagos con tarjeta quedan desactivados.
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
#url del frontend, para las redirecciones del alta de vendedores en Stripe Connect
app.frontend-url=http://localhost:4200
#comision al vendedor por venta con tarjeta: porcentaje + fijo en centimos (valores provisionales)
marketplace.commission.percent=2.5
marketplace.commission.fixed-cents=50