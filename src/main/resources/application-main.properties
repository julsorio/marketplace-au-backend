spring.application.name=marketplace-api

#context path
server.servlet.context-path=/api
#port
server.port=8002

#stripe y url del frontend: obligatorias como variables de entorno al desplegar
#(STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, FRONTEND_URL), igual que jwt.secret
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
app.frontend-url=${FRONTEND_URL}
#comision al vendedor por venta con tarjeta: porcentaje + fijo en centimos (valores provisionales)
marketplace.commission.percent=2.5
marketplace.commission.fixed-cents=50