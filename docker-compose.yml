# Solo para probar la imagen del backend en local junto a una MongoDB real dentro de
# contenedores — no es la configuración de despliegue en AWS/GCP (esa sigue el análisis de
# arquitectura y costes que ya hicimos aparte, con el gestor de secretos de cada plataforma
# en vez de variables de entorno en texto plano como aquí).
#
# Uso: desde backend_marketplace/, `docker compose up --build`
# La API queda en http://localhost:8002/api

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    ports:
      - "8002:8002"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_MONGODB_URI: mongodb://mongo:27017/marketplace
      # Secreto de prueba solo para este compose local — nunca el mismo valor que uses en
      # producción, y nunca committeado si alguna vez pasa a ser real.
      JWT_SECRET: CpsOwLfL7lhIMXc/aIOYPi6gRXAJbuNMu7OymFP57Oc=
      JWT_EXPIRATION: 300000
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    depends_on:
      - mongo

volumes:
  mongo_data:
